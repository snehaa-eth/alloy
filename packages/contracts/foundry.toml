[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "base-std/=lib/base-std/src/",
]
# Base precompile dispatch (B20 factory/tokens, PolicyRegistry) inside forge's EVM.
base = true

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 100
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = false
int_types = "long"

[lint]
ignore = ["test/**/*.sol"]
