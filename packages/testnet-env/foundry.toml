[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "base-std/=lib/base-std/src/",
]
# Deploy script reads config/prices.json and writes deployments/<chainId>*.json
fs_permissions = [
    { access = "read", path = "./config" },
    { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base_mainnet = "https://mainnet.base.org"
local = "http://127.0.0.1:8547"

[fmt]
line_length = 120

[lint]
lint_on_build = false
