# Keeps the serverless API (and its DB connection) and the waitlist page warm,
# so a visitor's first sign-up doesn't wait on a cold start.
name: keep-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API and site
        run: |
          for url in \
            https://crates-mantle.vercel.app/waitlist/count \
            https://alloyfi.vercel.app/waitlist ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 "$url" || echo "000")
            echo "$url -> $code"
          done
