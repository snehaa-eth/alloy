<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Alloy covers contact sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --bg:#0A0A0A; --paper:#F2F0ED; --text2:#9A9894; }
  html,body { margin:0; background:var(--bg); color:var(--paper); font-family:Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .wrap { padding:32px 30px; }
  h1 { font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text2); margin:0 0 14px; }
  .row { display:grid; grid-template-columns:repeat(4, 390px); gap:20px; margin-bottom:34px; }
  .raw img { width:390px; height:219px; display:block; border-radius:6px; }
  .raw span { display:block; font-size:12px; color:var(--text2); margin-top:8px; }
  .card { width:390px; border-radius:14px; overflow:hidden; background:#141414; border:1px solid #232323; }
  .cover { position:relative; height:219px; background-size:cover; background-position:center; }
  .cover::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(10,10,10,.6) 0%, rgba(10,10,10,0) 60%); }
  .cover .t { position:absolute; left:16px; bottom:14px; z-index:1; }
  .cover .name { font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .cover .sub { font-size:13px; color:var(--paper); opacity:.78; margin-top:3px; }
  .foot { padding:12px 16px; font-size:13px; color:var(--text2); display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Alloy basket covers: masters (1600×900, shown at 390px)</h1>
  <div class="row raw" id="raw"></div>
  <h1>Card overlay test: 60% bottom scrim, paper text (Inter)</h1>
  <div class="row" id="cards"></div>
</div>
<script>
  const covers = [
    ['capitol-tech', 'Capitol Tech', 'Burgundy', 'Politician-disclosed holdings'],
    ['big-tech', 'Big Tech, Trimmed', 'Emerald', 'Megacaps, equal-weighted'],
    ['picks-shovels', 'Picks & Shovels', 'Amber', 'Chips, power, tooling'],
    ['space-race', 'Space Race', 'Plum', 'Launch, satellites, defence'],
  ];
  const base = '../../../apps/web/public/brand/covers/';
  for (const [slug, name, tone, sub] of covers) {
    raw.insertAdjacentHTML('beforeend', `<div><img src="${base}${slug}.png" alt=""><span>${slug} · ${tone}</span></div>`);
    cards.insertAdjacentHTML('beforeend', `<div class="card"><div class="cover" style="background-image:url(${base}${slug}.png)"><div class="t"><div class="name">${name}</div><div class="sub">${sub}</div></div></div><div class="foot"><span>8 stocks</span><span>Rebalanced monthly</span></div></div>`);
  }
</script>
</body>
</html>
