<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Alloy Idea 01</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="assets/guil.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0A;
    font-feature-settings: "tnum" 1, "cv11" 1, "ss01" 1; -webkit-font-smoothing: antialiased; }
  #stage div, #stage span { box-sizing: border-box; }
  .abs { position: absolute; }
  canvas { position: absolute; left: 0; top: 0; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 60% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.18) 100%); }
  .c-guil path, .c-guil rect, .c-guil circle { fill: none; stroke: currentColor; }
</style>
</head>
<body>
<div id="stage">
  <div id="world" class="abs" style="inset:0"></div>
  <div id="top" class="abs" style="inset:0"></div>
  <div id="vig"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<script>
// =====================================================================================================
// ALLOY IDEA 01 "Which stocks?" (v2, after REVIEW-01). 780 frames @ 30 fps, 120 BPM grid (beat = 15 f).
// UI = v4 "Certificate + Alloy bar" (docs/design/cards-v4.html, cards-data/system_v4.py).
// Engravings come from system_v4.guilloche() on the REAL basket series (assets/guil.js, gen_guil.py).
// Every frame is a pure function of the frame number. ?sq=1 renders the 1:1 cut (1080x1080).
// =====================================================================================================
const SQ = new URLSearchParams(location.search).get('sq') === '1';
const VH = SQ ? 1080 : 1920;
if (SQ) { document.getElementById('stage').style.height = '1080px'; document.getElementById('grain').height = 1080; }
window.DURATION = 26; window.FPS = 30;
const C = {bg:'#0A0A0A', paper:'#F2F0ED', t2:'#9A9894', t3:'#C9C7C3', acc:'#C41A42', brand:'#6D001A',
  gold:'#C9A96E', warn:'#F2B33D', s1:'#141416', s2:'#1C1C1F', sheet:'#0F0F10', bd:'#26262A', i700:'#3A3A40', bdi:'#6B6B70'};
const TONE = {sapp:'#3E6FB8', emer:'#2E8B6A', amb:'#C98A2E', plum:'#8E5BA6', burg:'#B5304F'};
const INTER = "'Inter'", ANTON = "'Anton'", MONO = "'JetBrains Mono'";
const MONO_W = 0.6;               // JetBrains Mono advance (em)
const CX = 525;                   // certificate centre x (cert spans x 90–960)
const CERT = {x: 90, w: 870, pad: 36};
const IN_X = CERT.x + CERT.pad, IN_W = CERT.w - 2 * CERT.pad;   // 126 … 924 (798 wide)
const G = window.GUIL;            // {AIB, BTT, PNS, CVB}: svg, serial, recipe, tone, name

// ---------------------------------------------------------------- utils
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 12; i++) {
      const cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      const d = 3 * x1 * (1 - t) * (1 - 3 * t) + 3 * x2 * t * (2 - 3 * t) + 3 * t * t;
      if (Math.abs(d) < 1e-6) break; t -= cx / d; t = Math.min(1, Math.max(0, t));
    }
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
const easeOut = bez(0.2, 0.8, 0.2, 1), easeIn = bez(0.4, 0, 1, 1), easeInOut = bez(0.65, 0, 0.35, 1);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (f, a, b) => clamp((f - a) / (b - a));
const mix = (a, b, p) => a + (b - a) * p;
function spring(n, k, c) { let x = 0, v = 0; const dt = 1 / 30; for (let i = 0; i < n; i++) { v += (k * (1 - x) - c * v) * dt; x += v * dt; } return Math.min(1, Math.max(0, x)); }

// ---------------------------------------------------------------- text + headline registry
let WORDS = 0, TOP = '';
const countWords = (s) => s.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
function T(s, o) {
  const {x = null, y, font = INTER, w = 600, size, color = C.paper, ls = 0, scale = 1, op = 1, lh = 1.15, tx = 0, wrap = false, cw = 900, cx0 = 60, extra = ''} = o;
  const pos = x === null ? `left:${cx0}px;width:${cw}px;text-align:center;transform-origin:50% 50%;` : `left:${x}px;transform-origin:0 50%;`;
  return `<div class="abs" style="${pos}top:${y}px;white-space:${wrap ? 'normal' : 'pre'};font-family:${font};font-weight:${w};font-size:${size}px;line-height:${lh};letter-spacing:${ls}em;color:${color};opacity:${op};transform:translate(${tx}px,-50%) scale(${scale});${extra}">${s}</div>`;
}
// Headline (Anton). In the 1:1 cut headlines are re-set at the top of the square at 0.8x.
let SQ_HEAD_BOTTOM = 0;
function H(s, y, size, o = {}) {
  WORDS += countWords(s);
  if (SQ && SQ_MODE === 'band') {
    const lines = (s.match(/<br>/g) || []).length + 1, sz = size * 0.8, hgt = lines * sz * 0.9;
    const cy = 40 + hgt / 2; SQ_HEAD_BOTTOM = 40 + hgt;
    if (o.stamp) TOP += stampBox(o.stamp, 60, cy, 36);
    TOP += T(s, {...(o.stamp ? {x: 220} : {}), y: cy, font: ANTON, w: 400, size: sz, lh: 0.9, ls: 0.005, scale: o.scale || 1});
    return '';
  }
  let h = '';
  if (o.stamp) h += stampBox(o.stamp, 72, y, 44);
  return h + T(s, {...(o.stamp ? {x: 252} : {}), y, font: ANTON, w: 400, size, lh: 0.9, ls: 0.005, wrap: !o.stamp, scale: o.scale || 1});
}
function Cap(s, y, o = {}) {
  WORDS += countWords(s);
  const {size = 40, w = 500} = o;
  if (SQ && SQ_MODE === 'band') { TOP += T(s, {y: SQ_HEAD_BOTTOM ? SQ_HEAD_BOTTOM + 36 : 140, size: 36, w, color: C.t3}); return ''; }
  return T(s, {y, size, w, color: C.t3});
}
function stampBox(s, x, y, size) {
  return `<div class="abs" style="left:${x}px;top:${y}px;transform:translateY(-50%);border:1px solid ${C.bdi};border-radius:4px;padding:6px 14px;font-family:${MONO};font-size:${size}px;line-height:1.15;color:${C.paper};white-space:nowrap">${s}</div>`;
}
function wrapCam(html, cam = {}) {
  const {s = 1, tx = 0, ty = 0} = cam;
  return `<div class="abs" style="inset:0;transform-origin:525px 1000px;transform:translate(${tx}px,${ty}px) scale(${s})">${html}</div>`;
}

// ---------------------------------------------------------------- icons (stamps)
const ICO = {
  layers: '<path d="M12 3L2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 18l10 5 10-5"/>',
  up: '<path d="M7 17L17 7M8 7h9v9"/>', down: '<path d="M17 7L7 17M16 17H7V8"/>',
  check: '<path d="M4 12.5l5 5L20 6"/>', scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.2 7.8L20 19M8.2 16.2L20 5"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/>', chart: '<path d="M3 20h18M5 16l5-5 4 3 6-7"/>',
  plus: '<path d="M12 4v16M4 12h16"/>', arrow: '<path d="M4 12h16M14 6l6 6-6 6"/>',
};
const icon = (n, s = 26, col = 'currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:inline-block;vertical-align:-4px;margin-right:10px" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="square">${ICO[n]}</svg>`;

// ---------------------------------------------------------------- alloy bar (v4): stacked bands, thickness = weight, 2 px gaps, sheen
function alloyBar(items, tone, {x, y, w, h, grow = 1, dimExcept = null, sheen = 0, gap = 2, bandsShown = 99} = {}) {
  const n = items.length, tot = items.reduce((a, [, v]) => a + v, 0);
  const avail = h - gap * (n - 1);
  let yy = y, out = '';
  items.forEach(([t, v], k) => {
    if (k >= bandsShown) return;
    const bh = Math.max(0, avail * (v / tot) * grow);
    let op = 1 - 0.55 * k / Math.max(n - 1, 1);
    if (dimExcept && t !== dimExcept) op *= 0.35;
    const sx = mix(-0.6, 1.6, sheen % 1);
    out += `<div class="abs" style="left:${x}px;top:${yy}px;width:${w}px;height:${bh}px;background:${TONE[tone]};opacity:${op};overflow:hidden">
      <div class="abs" style="top:0;bottom:0;left:${(sx - 0.25) * w}px;width:${w * 0.5}px;background:linear-gradient(90deg, rgba(242,240,237,0) 0%, rgba(242,240,237,.28) 50%, rgba(242,240,237,0) 100%)"></div></div>`;
    yy += bh + gap * grow;
  });
  return out;
}
// legend: mono 30, "NVDA 35  MSFT 25 …"; returns html + positions of the ticker names
function legend(items, x, y, {size = 30, gap = 36, hideSet = null, numSet = null, dimExcept = null, fmt = (v) => `${Math.round(v)}`} = {}) {
  const cw = size * MONO_W; let xx = x, out = ''; const pos = {};
  items.forEach(([t, v]) => {
    const num = ' ' + fmt(v);
    const dim = dimExcept && t !== dimExcept;
    pos[t] = {x: xx, y};
    if (!(hideSet && hideSet.has(t))) out += T(t, {x: xx, y, font: MONO, w: 400, size, color: dim ? C.bdi : (dimExcept ? C.paper : C.t2)});
    out += T(num, {x: xx + t.length * cw, y, font: MONO, w: 400, size, color: dim ? C.bdi : (dimExcept ? C.paper : C.t2), op: numSet && !numSet.has(t) ? 0 : 1});
    xx += (t.length + num.length) * cw + gap;
  });
  return {html: out, pos};
}

// ---------------------------------------------------------------- certificate (v4 anatomy, explicit y cursor)
// rows: head → art (+2 px→4 px burgundy signature rule) → body rows → foot. Returns {html, y:{...}, bottom}
let CB = {top: 1e9, bottom: 0};
function cert(top, o) {
  const yy = {}; let h = '', y = top;
  // head
  const HEAD = 84;
  h += T(o.serial, {x: IN_X, y: y + HEAD / 2, font: MONO, w: 400, size: 30, color: C.t2, ls: 0.06});
  if (o.stamp) h += `<div class="abs" style="right:${1080 - (CERT.x + CERT.w - 28)}px;top:${y + HEAD / 2}px;transform:translateY(-50%);border:1px solid ${o.stampCol || C.bdi};border-radius:4px;height:52px;padding:0 16px;display:flex;align-items:center;font-family:${MONO};font-size:30px;letter-spacing:.08em;color:${C.paper};white-space:nowrap">${icon(o.stampIcon || 'layers', 24, o.stampIconCol || 'currentColor')}${o.stamp}</div>`;
  y += HEAD; h += `<div class="abs" style="left:${CERT.x}px;top:${y}px;width:${CERT.w}px;height:1px;background:${C.bd}"></div>`;
  // art (engraving / chart / ring) + signature rule
  if (o.artH) {
    yy.art = y; h += o.art(y, o.artH); y += o.artH;
    h += `<div class="abs" style="left:${CERT.x}px;top:${y}px;width:${CERT.w}px;height:4px;background:${C.acc}"></div>`; y += 4;
  }
  y += 34;
  for (const r of o.rows) { yy[r.id || r.kind] = y; const out = r.render(y); h += out.html; y += out.h + (r.gap ?? 24); }
  y += 10;
  if (o.foot) {
    h += `<div class="abs" style="left:${CERT.x}px;top:${y}px;width:${CERT.w}px;height:1px;background:${C.bd}"></div>`;
    h += o.foot(y, 84); y += 84;
  }
  const frame = `<div class="abs" style="left:${CERT.x}px;top:${top}px;width:${CERT.w}px;height:${y - top}px;background:${C.s1};border:1px solid ${C.bd};border-radius:4px"></div>`;
  if (!o.probe) { CB.top = Math.min(CB.top, top); CB.bottom = Math.max(CB.bottom, y); }
  return {html: frame + h, y: yy, bottom: y, top};
}
// Anton lacks U+2212 / U+2192: draw them so no fallback font ever appears in a figure
function antonSafe(s) {
  return s.replace(/−/g, `<span style="display:inline-block;width:0.36em;height:0.085em;background:${C.paper};vertical-align:0.34em;margin-right:0.05em"></span>`)
          .replace(/ → /g, `<svg viewBox="0 0 40 24" style="display:inline-block;width:0.5em;height:0.3em;margin:0 0.16em;vertical-align:0.18em" fill="none" stroke="${C.paper}" stroke-width="4" stroke-linecap="square"><path d="M2 12H36M26 3l10 9-10 9"/></svg>`);
}
// row helpers
const R = {
  title: (s, o = {}) => ({kind: 'title', gap: o.gap, render: (y) => ({html: T(s, {x: IN_X, y: y + 27, size: 46, w: 600, op: o.op ?? 1}), h: 54})}),
  label: (s, o = {}) => ({kind: 'label', gap: 6, render: (y) => ({html: T(s, {x: IN_X, y: y + 18, font: MONO, w: 400, size: 30, color: C.t2, ls: 0.08}), h: 36})}),
  figure: (s, unit = '', o = {}) => ({kind: 'figure', gap: o.gap, render: (y) => ({html:
    `<div class="abs" style="left:${IN_X}px;top:${y}px;height:112px;display:flex;align-items:baseline;gap:16px;opacity:${o.op ?? 1};transform-origin:0 50%;transform:scale(${o.scale || 1})">
      <span style="font-family:${ANTON};font-size:124px;line-height:112px;color:${C.paper};letter-spacing:.02em;white-space:nowrap">${antonSafe(s)}</span>
      ${unit ? `<span style="font-family:${MONO};font-size:30px;color:${C.t2}">${unit}</span>` : ''}</div>`, h: 112})}),
  ledger: (a, b, o = {}) => ({kind: 'ledger', gap: o.gap, render: (y) => {
    const H2 = 124, half = IN_W / 2, op = o.op ?? 1;
    const cell = (k, v, x) => T(k, {x, y: y + 38, font: MONO, w: 400, size: 30, color: C.t2, ls: 0.06, op}) + T(v, {x, y: y + 86, size: 40, w: 600, op});
    return {html: `<div class="abs" style="left:${IN_X}px;top:${y}px;width:${IN_W}px;height:1px;background:${C.bd}"></div>
      <div class="abs" style="left:${IN_X}px;top:${y + H2}px;width:${IN_W}px;height:1px;background:${C.bd}"></div>
      <div class="abs" style="left:${IN_X + half}px;top:${y}px;width:1px;height:${H2}px;background:${C.bd}"></div>`
      + (a ? cell(a[0], a[1], IN_X) : '') + (b ? cell(b[0], b[1], IN_X + half + 36) : ''), h: H2};
  }}),
  button: (s, o = {}) => ({kind: 'button', gap: o.gap, render: (y) => ({html:
    `<div class="abs" style="left:${IN_X}px;top:${y}px;width:${IN_W}px;height:108px;background:${o.disabled ? C.s2 : C.paper};border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:${INTER};font-weight:600;font-size:42px;color:${o.disabled ? C.t2 : C.bg}">${s}
      <div class="abs" style="left:0;bottom:0;height:10px;width:${IN_W * (o.fill || 0)}px;background:${C.acc}"></div></div>`, h: 108})}),
  custom: (id, hgt, fn, o = {}) => ({kind: id, id, gap: o.gap, render: (y) => ({html: fn(y), h: hgt})}),
};
// 1:1 only: compliance lines are lifted out of the scaled certificate and re-set at ≥ 26 px (REVIEW-03 note 2)
let SQ_FOOT = [];
const footLM = (left, right, o = {}) => (y, h) => (SQ && SQ_MODE === 'band' && o.compliance) ? (SQ_FOOT.push({text: left, y: y + h / 2}), '') :
  `<div class="abs" style="left:${IN_X}px;top:${y + h / 2}px;transform:translateY(-50%);font-family:${INTER};font-weight:500;font-size:${o.size || 32}px;color:${o.linkCol || C.t2};text-decoration:${o.noUnderline ? 'none' : 'underline'};text-underline-offset:6px;text-decoration-thickness:${o.thick || 2}px;white-space:nowrap">${left}</div>`
  + (right ? T(right, {x: null, cx0: IN_X, cw: IN_W, y: y + h / 2, font: MONO, w: 400, size: 30, color: C.t2, extra: 'text-align:right;'}) : '');
const engraving = (sym) => (y, h) =>
  `<div class="abs c-guil-wrap" style="left:${CERT.x + 1}px;top:${y}px;width:${CERT.w - 2}px;height:${h}px;color:${TONE[G[sym].tone]};background:${C.bg}">
    ${G[sym].svg.replace('<svg ', `<svg width="${CERT.w - 2}" height="${h}" style="display:block" `)}</div>`;

// ---------------------------------------------------------------- the Holding certificate
const HOLD_TOP = 470, ENGR_H = 200, BAR_H = 72;
function holding(sym, f, o = {}) {
  const b = G[sym];
  const strategy = {AIB: 'Balanced', BTT: 'Equal-weighted', PNS: 'Balanced', CVB: 'Balanced'}[sym];
  let leg = null;
  const c = cert(HOLD_TOP, {
    serial: b.serial, stamp: 'BASKET', stampIcon: 'layers',
    artH: ENGR_H, art: engraving(sym),
    rows: [
      R.title(b.name, {gap: 20}),
      R.label('FROM'),
      R.figure('$5', '', {gap: 22}),
      R.custom('bar', BAR_H, (y) => alloyBar(b.recipe, b.tone, {x: IN_X, y, w: IN_W, h: BAR_H, grow: o.grow ?? 1, sheen: (f % 90) / 90}), {gap: 14}),
      R.custom('legend', 36, (y) => { leg = legend(b.recipe, IN_X, y + 18, {hideSet: o.hideSet, numSet: o.numSet}); return leg.html; }, {gap: 22}),
      R.ledger(['STOCKS', String(b.recipe.length)], ['STRATEGY', strategy]),
      R.button('Buy', {gap: 0}),
    ],
    foot: footLM('See inside →', sym === 'AIB' ? '@kavya' : ''),
  });
  return {html: c.html, legendPos: leg ? leg.pos : {}, cert: c};
}

// ---------------------------------------------------------------- S1 ticker wall (no collisions, flashes capped)
const WALL_TICKERS = ['AMD','AVGO','TSM','ORCL','ARM','SMCI','PLTR','MU','ASML','DELL','INTC','ANET','VRT','CRWV','SNOW','QCOM','MRVL','CRM','ADBE','NOW',
  'IBM','AAPL','TSLA','LRCX','AMAT','KLAC','CDNS','SNPS','PANW','CRWD','NET','DDOG','MDB','HPE','CSCO','TXN','ON'];
const BASKET5 = ['NVDA', 'MSFT', 'GOOGL', 'AMZN', 'META'];
let WALL = null;
const tw = (t, size) => t.length * 0.74 * size;     // conservative Inter 600 caps width
function buildWall() {
  const R2 = mulberry(4242); WALL = [];
  const rows = 14, rowStep = 150, y0 = -30;
  let k = 0;
  // basket tickers: rows 3,5,7,8,10 (inside the live box)
  const basketRow = {3: 'NVDA', 5: 'MSFT', 7: 'GOOGL', 9: 'AMZN', 11: 'META'};
  for (let r = 0; r < rows; r++) {
    let x = -20 + R2() * 60;
    const y = y0 + r * rowStep + R2() * 30;
    const items = [];
    while (x < 1080) {
      const size = 56 + Math.floor(R2() * 41);
      let t;
      if (basketRow[r] && !items.some((q) => q.basket) && x > 200 && x < 560) t = basketRow[r];
      else { t = WALL_TICKERS[k % WALL_TICKERS.length]; k++; }
      const w = tw(t, size);
      items.push({t, x, y, size, basket: BASKET5.includes(t)});
      x += w + 24 + 30 + R2() * 70;
    }
    WALL.push(...items);
  }
}
function wallPos(q, f) { return {x: q.x, y: q.y - 1.5 * Math.min(f, 59)}; }
// headline plate keep-out: no flashes within 80 px of the headline block
const PLATE = {x0: 60, x1: 960, y0: 625 - 80, y1: 1130 + 80};
function S1(f) {
  if (!WALL) buildWall();
  const nFlash = f >= 30 ? 6 : 3, R2 = mulberry(7000 + Math.floor(f / 2));
  const eligible = [];
  WALL.forEach((q, i) => {
    const p = wallPos(q, f), w = tw(q.t, q.size), hh = q.size * 0.75;
    const inLive = p.x >= 70 && p.x + w <= 950 && p.y - hh / 2 >= 150 && p.y + hh / 2 <= 1630;
    const nearPlate = !(p.y + hh / 2 < PLATE.y0 || p.y - hh / 2 > PLATE.y1);
    if (inLive && !nearPlate) eligible.push(i);
  });
  const flash = new Set();
  for (let i = 0; i < nFlash && eligible.length; i++) flash.add(eligible[Math.floor(R2() * eligible.length)]);
  let h = '';
  WALL.forEach((q, i) => { const p = wallPos(q, f); h += T(q.t, {x: p.x, y: p.y, size: q.size, w: 600, color: flash.has(i) ? C.t2 : C.i700}); });
  h += `<div class="abs" style="left:${510 - 640}px;top:${880 - 480}px;width:1280px;height:960px;background:radial-gradient(closest-side, rgba(10,10,10,.88) 62%, rgba(10,10,10,0))"></div>`;
  h += H('EVERYONE SAYS<br>BUY AI.', 760, 150);
  if (f >= 30) h += H('WHICH STOCKS?', 1060, 136, {scale: f - 30 < 3 ? mix(1.06, 1, (f - 30) / 3) : 1});
  let cam = {};
  if (f >= 30) { const r = mulberry(8000 + f); cam.tx = (r() * 2 - 1) * 3; cam.ty = (r() * 2 - 1) * 3; }
  if (f >= 52) cam.s = mix(1, 1.03, easeIn(lin(f, 52, 60)));
  return wrapCam(h, cam);
}

// ---------------------------------------------------------------- S2 the turn: five tickers fly into the legend
function S2(f) {
  if (!WALL) buildWall();
  const n = f - 60;
  const ORDER = ['NVDA', 'MSFT', 'GOOGL', 'AMZN', 'META'];       // legend order, left to right
  const landF = (t) => 67 + ORDER.indexOf(t);                   // lands f67 … f71 (1-frame stagger)
  const landed = (t) => f >= landF(t);
  const lock = ORDER.every(landed);
  let h = '';
  const sc = f >= 66 ? (f - 66 < 6 ? mix(1.04, 1, easeOut((f - 66) / 6)) : 1) : 1;

    const p0 = wallPos(q, 59);

    });
  }
  if (f >= 90) h += H('BUY THE<br>WHOLE IDEA.', 300, 140);
  return wrapCam(h, {s: f >= 72 ? mix(1, 1.02, lin(f, 72, 120)) : 1});

  return wrapCam(h, {});
}

// ---------------------------------------------------------------- S12 tagline + full-width Alloy bar
const BRAND_BAR = [['sapp', 20], ['emer', 20], ['amb', 20], ['plum', 20], ['burg', 20]];
function brandBar(x, y, w, h, {reveal = 1, sheen = -1} = {}) {
  const n = 5, gap = Math.max(1, h / 22), bh = (h - gap * (n - 1)) / n;
  let out = '';
  BRAND_BAR.forEach(([t], k) => {
    out += `<div class="abs" style="left:${x}px;top:${y + k * (bh + gap)}px;width:${w * reveal}px;height:${bh}px;background:${TONE[t]};overflow:hidden">`
      + (sheen >= 0 ? `<div class="abs" style="top:0;bottom:0;left:${(mix(-0.6, 1.6, sheen) - 0.25) * w}px;width:${w * 0.5}px;background:linear-gradient(90deg, rgba(242,240,237,0), rgba(242,240,237,.32), rgba(242,240,237,0))"></div>` : '') + `</div>`;
  });
  return out;
}
const TAG_BAR = {x: 80, y: 1072, w: 850, h: 44};
function S12(f) {
  let h = '';
  const lines = [['INVEST IN', 660, 690], ['STORIES,', 675, 834], ['NOT SYMBOLS.', 690, 978]];
  for (const [t, fl, y] of lines) {
    if (f < fl) continue;
    const sc = f - fl < 3 ? mix(1.05, 1, (f - fl) / 3) : 1;
    WORDS += countWords(t);
    h += T(t, {x: 80, y, font: ANTON, w: 400, size: 150, lh: 0.9, ls: 0.005, scale: sc});
  }
  if (f >= 690) h += brandBar(TAG_BAR.x, TAG_BAR.y, TAG_BAR.w, TAG_BAR.h, {reveal: easeOut(lin(f, 690, 705)), sheen: f >= 705 ? lin(f, 705, 719) : -1});
  return wrapCam(h, {s: f >= 700 ? mix(1, 1.03, lin(f, 700, 720)) : 1});
}

// ---------------------------------------------------------------- S13 end card
function S13(f) {
  const sq = SQ;
  const Y = sq ? {alloy: 290, bar: 440, tag: 510, pill: 620, handle: 720, legal: 930} : {alloy: 760, bar: 924, tag: 994, pill: 1124, handle: 1234, legal: 1560};
  let h = T('ALLOY', {y: Y.alloy, font: ANTON, w: 400, size: sq ? 220 : 280, lh: 0.9, ls: 0.01}); WORDS += 1;
  // continuity: the tagline bar shrinks into the end card
  h += brandBar(510 - 150, Y.bar - 11, 300, 22, {});            // hard cut into its slot on the f720 downbeat
  const after = 1;
  WORDS += 3; h += T('Stories, not symbols.', {y: Y.tag, size: 48, w: 500, color: C.t3, op: after});
  const pulse = f >= 750 && f < 756 ? [1, .6, .3, .3, .6, 1][f - 750] : 0;
  const bcol = pulse ? `rgba(242,240,237,${pulse})` : C.bdi;
  h += `<div class="abs" style="left:${510 - 190}px;top:${Y.pill - 42}px;width:380px;height:84px;border:1px solid ${bcol};border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:${INTER};font-weight:600;font-size:40px;letter-spacing:.08em;color:${C.paper};padding-left:.08em;opacity:${after}">COMING SOON</div>`;
  WORDS += 2;
  h += T('@alloy_fi', {y: Y.handle, size: 44, w: 600, color: C.t2, op: after});
  h += T('Tokenized stock exposure, not shares. Not for US persons.', {y: Y.legal, size: sq ? 30 : 28, w: 500, color: C.t2});
  return h;
}

// ---------------------------------------------------------------- grain
const grainCv = document.getElementById('grain'), gctx = grainCv.getContext('2d');
const gimg = gctx.createImageData(1080, VH);
function grain(f) {
  const R2 = mulberry(90000 + f), d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = R2() * 2 - 1, v = n > 0 ? 255 : 0;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = Math.abs(n) * 0.04 * 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

// ---------------------------------------------------------------- dispatcher (+ 1:1 reframing)
let SQ_MODE = 'band';
function scene(f) {
  if (f < 60) return S1(f);
  if (f < 120) return S2(f);
  if (f < 180) return S3(f);
  if (f < 240) return S4(f);
  if (f < 300) return S5(f);
  if (f < 360) return S6(f);
  if (f < 420) return S7(f);
  if (f < 480) return S8(f);
  if (f < 540) return S9(f);
  if (f < 600) return S10(f);
  if (f < 660) return S11(f);
  if (f < 720) return S12(f);
  return S13(f);
}
function world(f) {
  TOP = ''; SQ_HEAD_BOTTOM = 0; CB = {top: 1e9, bottom: 0}; SQ_FOOT = [];
  if (!SQ) return scene(f);
  // 1:1: hook + tagline are cropped (y offset), the end card has its own layout,
  // every product shot maps its certificate band (y 470–1610) into y 250–960 and re-sets the headline on top.
  if (f < 60 || (f >= 660 && f < 720)) { SQ_MODE = 'crop'; return `<div class="abs" style="inset:0;transform:translateY(${f < 60 ? -330 : -340}px)">${scene(f)}</div>`; }
  if (f >= 720) { SQ_MODE = 'crop'; return scene(f); }
  SQ_MODE = 'band';
  const inner = scene(f);
  const top = Math.max(230, SQ_HEAD_BOTTOM + (TOP.includes('color:#C9C7C3') ? 84 : 26));
  const b0 = CB.top < 1e9 ? CB.top - 10 : 470, b1 = CB.bottom > 0 ? CB.bottom + 10 : 1610;
  const s = Math.min(0.9, (975 - top) / (b1 - b0));
  const ox = 540 - 525 * s, oy = top - b0 * s;
  if (!(f >= 180 && f < 188)) for (const ft of SQ_FOOT) TOP += T(ft.text, {x: ox + IN_X * s, y: oy + ft.y * s, size: 26, w: 500, color: C.t2, lh: 1.1, wrap: true, extra: `width:${IN_W * s}px;`});
  return `<div class="abs" style="left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;transform:translate(${540 - 525 * s}px,${top - b0 * s}px) scale(${s})">${inner}</div>`;
}
window.renderAt = function (t) {
  const f = Math.max(0, Math.min(779, Math.round(t * 30)));
  WORDS = 0;
  document.getElementById('world').innerHTML = world(f);
  document.getElementById('top').innerHTML = TOP;
  grain(f);
  window.__frame = f; window.__words = WORDS;
};
window.renderAt(0);
</script>
</body>
