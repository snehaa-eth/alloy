<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Alloy · style test 3D</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 600; src: url(fonts/Inter-600.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url(fonts/Inter-500.woff2) format("woff2"); }
  @font-face { font-family: "JBM"; font-weight: 400; src: url(fonts/JetBrainsMono-400.woff2) format("woff2"); }
  @font-face { font-family: "JBM"; font-weight: 600; src: url(fonts/JetBrainsMono-600.woff2) format("woff2"); }
  html, body { margin: 0; background: #0A0A0A; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; background: #0A0A0A; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
  #gl { z-index: 1; }
  #ui { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #fx { z-index: 3; }

  /* certificate frame */
  .hl { position: absolute; background: #F2F0ED; transform-origin: 0 0; }
  .ring { position: absolute; width: 12px; height: 12px; border: 1px solid rgba(242,240,237,.42); border-radius: 50%; box-sizing: border-box; }
  .mono { position: absolute; font-family: "JBM"; font-weight: 400; font-size: 24px; letter-spacing: .14em; color: #9A9894; white-space: pre; }
  #rule { position: absolute; height: 2px; background: #C41A42; transform-origin: 0 0; }

  /* hero lines */
  .line { position: absolute; left: 0; right: 0; text-align: center; font-family: "Inter"; font-weight: 600;
          font-size: 88px; line-height: 1.08; letter-spacing: -0.022em; color: #F2F0ED; white-space: nowrap;
          font-feature-settings: "cv11" 1, "ss01" 1; }
  .line .row { display: block; }
  .ch { position: relative; display: inline-block; white-space: pre; }
  .ch .g { visibility: hidden; }
  .ch .s { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-family: "JBM"; font-weight: 400;
           font-size: 0.7em; line-height: 1.54; color: #6E95D2; }
  .dim { color: #9A9894; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="ui"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
